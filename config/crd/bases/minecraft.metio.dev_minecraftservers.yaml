---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: minecraftservers.minecraft.metio.dev
spec:
  group: minecraft.metio.dev
  names:
    kind: MinecraftServer
    listKind: MinecraftServerList
    plural: minecraftservers
    shortNames:
    - mcs
    singular: minecraftserver
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MinecraftServer is the Schema for the minecraftservers API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MinecraftServerSpec defines the desired state of a Minecraft
              server.
            properties:
              backup:
                description: Backup holds per-server backup overrides.
                properties:
                  backupIntervalHours:
                    description: BackupIntervalHours is the backup interval in hours.
                    minimum: 0
                    type: integer
                  enabled:
                    description: Enabled controls whether backups run for this server.
                    type: boolean
                  keep:
                    description: Keep is the number of backups to retain.
                    minimum: 0
                    type: integer
                  keepUnit:
                    description: KeepUnit is the retention unit for Keep.
                    enum:
                    - hourly
                    - daily
                    - weekly
                    - monthly
                    - yearly
                    type: string
                required:
                - enabled
                type: object
              minecraftVersion:
                description: MinecraftVersion is the vanilla Minecraft version to
                  run.
                type: string
              modpack:
                description: Modpack references a modpack to boot with.
                properties:
                  platform:
                    description: Platform is the pack source, e.g. "modrinth".
                    enum:
                    - modrinth
                    type: string
                  projectId:
                    description: ProjectID identifies the pack on the platform.
                    minLength: 1
                    pattern: ^[A-Za-z0-9]+$
                    type: string
                  versionId:
                    description: VersionID pins a specific version of the pack; empty
                      means latest.
                    pattern: ^[A-Za-z0-9]+$
                    type: string
                required:
                - platform
                - projectId
                type: object
              serverID:
                description: ServerID is the unique identifier of the server.
                minLength: 1
                type: string
              shutdownSchedule:
                description: ShutdownSchedule describes a recurring daily shutdown
                  time in UTC.
                properties:
                  enabled:
                    description: Enabled controls whether the shutdown schedule is
                      active.
                    type: boolean
                  time:
                    description: Time is the daily shutdown time in UTC, in HH:MM
                      format.
                    pattern: ^([01]?[0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                required:
                - enabled
                - time
                type: object
                x-kubernetes-validations:
                - message: time is required when enabled
                  rule: '!self.enabled || self.time != '''''
              whitelist:
                description: Whitelist controls the server whitelist.
                properties:
                  enabled:
                    description: Enabled controls whether the whitelist is enforced.
                    type: boolean
                  players:
                    description: Players is the list of whitelisted players.
                    items:
                      description: WhitelistEntry identifies a single whitelisted
                        player.
                      properties:
                        username:
                          description: Username is the player's Minecraft username.
                          minLength: 1
                          type: string
                        uuid:
                          description: UUID is the player's Mojang UUID.
                          type: string
                      required:
                      - username
                      - uuid
                      type: object
                    type: array
                required:
                - enabled
                type: object
            required:
            - serverID
            type: object
            x-kubernetes-validations:
            - message: exactly one of minecraftVersion or modpack must be set
              rule: (has(self.modpack) && !has(self.minecraftVersion)) || (!has(self.modpack)
                && has(self.minecraftVersion) && self.minecraftVersion != '')
          status:
            description: MinecraftServerStatus defines the observed state of a Minecraft
              server.
            properties:
              ready:
                description: Ready indicates whether the server is ready.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
